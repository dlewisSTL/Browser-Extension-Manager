<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Browser Extension Manager UI</title>
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="stylesheet" href="styles/browser-extension-manager-ui.css">
    </head>
    <body>
        <div class="container browser-extension-manager">
            <header>
                <nav>
                    <a class="logo-link" href="/index.html">
                        <img class="logo-light" src="images/logo.svg" alt="Extension Manager">
                        <img class="logo-dark" src="images/logo-dark.webp" alt="Extension Manager">
                    </a>
                    <button class="settings-light-dark" type="button" aria-label="Toggle dark mode">
                        <img class="moon-icon" src="images/icon-moon.svg" alt="">
                        <img class="sun-icon" src="images/icon-sun.svg" alt="">
                    </button>
                </nav>
            </header>
            <main>
                <section class="extensions-header">
                    <h1>Extensions List</h1>
                    <div class="filter-container">
                        <button class="all-button active" type="button" aria-pressed="true">All</button>
                        <button class="active-button" type="button" aria-pressed="false">Active</button>
                        <button class="inactive-button" type="button" aria-pressed="false">Inactive</button>
                    </div>
                </section>
                <div class="extensions-container"></div>
            </main>
        </div>
        <div class="modal-overlay" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
                <h2 id="modal-title">Remove Extension?</h2>
                <p class="modal-message">Are you sure you want to remove this extension?</p>
                <div class="modal-actions">
                    <button class="cancel-button" type="button">
                        Cancel
                    </button>
                    <button class="confirm-remove-button" type="button">
                        Remove
                    </button>
                </div>
            </div>
        </div>
        <div class="toast" role="status" aria-live="polite">
            <p class="toast-message"></p>
            <button class="undo-button" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.563 1.281h.949c.246 0 .422.211.422.457l-.07 3.446a8.6 8.6 0 0 1 7.277-3.868c4.816 0 8.718 3.938 8.718 8.72-.035 4.816-3.937 8.683-8.718 8.683a8.86 8.86 0 0 1-5.871-2.215.446.446 0 0 1 0-.633l.703-.703c.14-.14.386-.14.562 0 1.23 1.09 2.813 1.723 4.606 1.723A6.88 6.88 0 0 0 17.03 10c0-3.797-3.093-6.89-6.89-6.89-2.813 0-5.203 1.687-6.293 4.078l4.43-.106c.245 0 .456.176.456.422v.95c0 .245-.21.421-.421.421h-6.75a.406.406 0 0 1-.422-.422v-6.75c0-.21.175-.422.422-.422"/></svg>
                Undo
            </button>
        </div>
        <script type="module" src="scripts/index.js"></script> 
    </body>
</html>
